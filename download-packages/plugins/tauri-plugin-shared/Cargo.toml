[package]
name = "tauri-plugin-shared"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared contracts for reusable Tauri plugins"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2"
