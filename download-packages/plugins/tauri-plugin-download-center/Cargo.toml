[package]
name = "tauri-plugin-download-center"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-download-center"
license = "MIT OR Apache-2.0"
description = "Reusable persistent download-center plugin for Tauri v2"

[dependencies]
async-trait = "0.1"
tauri-plugin-shared = { version = "0.1", path = "../tauri-plugin-shared" }
futures = "0.3"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tauri = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
